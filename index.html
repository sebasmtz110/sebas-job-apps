<title>Sebas's Job Applications</title>
<style>
:root {
  --bg: #f3f1ec;
  --bg-soft: #ebe8e1;
  --surface: #ffffff;
  --ink: #1c1917;
  --ink-2: #57534e;
  --ink-3: #a8a29e;
  --line: #e7e5e4;
  --line-2: #f0eeea;
  --accent: #3d5a80;
  --accent-2: #2c4463;
  --accent-soft: #e8eef5;
  --ok: #3f6212;
  --ok-bg: #f1f8e9;
  --ok-line: #d8e8c0;
  --warn: #9a3412;
  --warn-bg: #fff7ed;
  --warn-line: #f3d9bf;
  --rose: #9f1239;
  --rose-bg: #fff1f2;
  --rose-line: #f5d0d8;
  --shadow: 0 1px 2px rgba(28,25,23,.04), 0 8px 28px rgba(28,25,23,.06);
  --shadow-sm: 0 1px 2px rgba(28,25,23,.05);
  --radius: 18px;
  --radius-sm: 12px;
  --nav-h: 64px;
  --font: "Inter", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.22,1,.36,1);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(900px 480px at 8% -8%, #dfe7f1 0%, transparent 55%),
    radial-gradient(700px 400px at 100% 0%, #e9e4d8 0%, transparent 50%),
    var(--bg);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }

/* Top nav */
.topnav {
  position: sticky;
  top: 0;
  z-index: 40;
  height: var(--nav-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 clamp(16px, 4vw, 36px);
  background: rgba(255,255,255,.82);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 650;
  letter-spacing: -0.02em;
  font-size: 0.98rem;
}
.brand-mark {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: linear-gradient(145deg, var(--accent), #5c7a9e);
  box-shadow: var(--shadow-sm);
}
.nav-links {
  display: flex;
  gap: 4px;
  background: var(--bg-soft);
  padding: 4px;
  border-radius: 999px;
}
.nav-links a {
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 0.86rem;
  font-weight: 560;
  color: var(--ink-2);
  transition: background .18s var(--ease), color .18s var(--ease);
}
.nav-links a.active, .nav-links a:hover {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}
.nav-meta {
  font-size: 0.78rem;
  color: var(--ink-3);
  white-space: nowrap;
}
@media (max-width: 640px) {
  .nav-meta { display: none; }
  .brand span { display: none; }
}

.shell {
  width: min(1040px, calc(100% - 32px));
  margin: 0 auto;
  padding: 36px 0 72px;
}

/* Views */
.view { display: none; animation: fadeUp .35s var(--ease); }
.view.active { display: block; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

.page-head {
  margin-bottom: 28px;
}
.page-head .kicker {
  display: inline-block;
  font-size: 0.7rem;
  font-weight: 650;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
}
.page-head h1 {
  margin: 0 0 8px;
  font-size: clamp(1.7rem, 4vw, 2.25rem);
  font-weight: 650;
  letter-spacing: -0.035em;
  line-height: 1.15;
}
.page-head p {
  margin: 0;
  color: var(--ink-2);
  font-size: 1rem;
  max-width: 40em;
}
.back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 14px;
  font-size: 0.86rem;
  font-weight: 560;
  color: var(--accent);
}
.back:hover { color: var(--accent-2); }

/* Counter cards */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 36px;
}
.stat {
  appearance: none;
  display: block;
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 20px 18px;
  box-shadow: var(--shadow);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s;
}
.stat::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--bar, var(--accent));
}
.stat:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(28,25,23,.1);
  border-color: #ddd6cc;
}
.stat:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.stat .n {
  font-size: clamp(1.9rem, 3.6vw, 2.4rem);
  font-weight: 650;
  letter-spacing: -0.04em;
  line-height: 1;
  margin-bottom: 8px;
}
.stat .l {
  font-size: 0.8rem;
  font-weight: 520;
  color: var(--ink-2);
}
.stat .hint {
  margin-top: 10px;
  font-size: 0.72rem;
  color: var(--ink-3);
  font-weight: 500;
}
.stat.submitted { --bar: #65a30d; }
.stat.progress { --bar: #ea580c; }
.stat.paused { --bar: #e11d48; }
.stat.total { --bar: var(--accent); }

/* Dashboard recent list */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line-2);
}
.panel-head h2 {
  margin: 0;
  font-size: 0.95rem;
  font-weight: 650;
  letter-spacing: -0.01em;
}
.panel-head a {
  font-size: 0.82rem;
  font-weight: 560;
  color: var(--accent);
}

/* Apps layout with tabs */
.apps-layout {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 20px;
  align-items: start;
}
.filters {
  position: sticky;
  top: calc(var(--nav-h) + 16px);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px;
  box-shadow: var(--shadow-sm);
}
.filters .flabel {
  padding: 8px 12px 6px;
  font-size: 0.68rem;
  font-weight: 650;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.filter-btn {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  appearance: none;
  border: none;
  background: transparent;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 0.88rem;
  font-weight: 540;
  color: var(--ink-2);
  cursor: pointer;
  text-align: left;
  transition: background .15s, color .15s;
}
.filter-btn:hover { background: var(--bg); color: var(--ink); }
.filter-btn.active {
  background: var(--accent-soft);
  color: var(--accent-2);
}
.filter-btn .count {
  font-size: 0.75rem;
  font-weight: 650;
  color: var(--ink-3);
  background: var(--bg);
  padding: 2px 8px;
  border-radius: 999px;
}
.filter-btn.active .count {
  background: var(--surface);
  color: var(--accent);
}

.tabs-mobile {
  display: none;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 14px;
  -webkit-overflow-scrolling: touch;
}
.tabs-mobile .filter-btn {
  flex: 0 0 auto;
  width: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 14px;
  gap: 8px;
}
.tabs-mobile .filter-btn.active {
  border-color: #c5d2e3;
}

.app-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.app-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 16px 18px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform .18s var(--ease), box-shadow .18s, border-color .18s;
}
.app-row:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow);
  border-color: #ddd6cc;
}
.app-row h3 {
  margin: 0 0 4px;
  font-size: 1rem;
  font-weight: 650;
  letter-spacing: -0.015em;
}
.app-row .role {
  margin: 0 0 4px;
  font-size: 0.9rem;
  color: var(--ink);
}
.app-row .sub {
  margin: 0;
  font-size: 0.8rem;
  color: var(--ink-2);
}
.app-row .right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}
.app-row .thumb {
  width: 72px;
  height: 46px;
  object-fit: cover;
  object-position: top;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg);
}
.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--ink-2);
  background: var(--surface);
  border: 1px dashed var(--line);
  border-radius: var(--radius);
}

.pill {
  display: inline-flex;
  align-items: center;
  font-size: 0.68rem;
  font-weight: 650;
  letter-spacing: .04em;
  text-transform: uppercase;
  padding: 5px 10px;
  border-radius: 999px;
  border: 1px solid transparent;
  white-space: nowrap;
}
.pill-submitted { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-line); }
.pill-progress { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
.pill-paused { color: var(--rose); background: var(--rose-bg); border-color: var(--rose-line); }
.pill-other { color: var(--ink-2); background: var(--bg); border-color: var(--line); }

/* Detail */
.detail-grid {
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  gap: 20px;
  align-items: start;
}
.detail-card, .shot-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px;
}
.detail-card h2 {
  margin: 0 0 4px;
  font-size: 1.35rem;
  font-weight: 650;
  letter-spacing: -0.02em;
}
.detail-card .role {
  margin: 0 0 10px;
  font-size: 1rem;
}
.detail-card .meta {
  margin: 0 0 18px;
  color: var(--ink-2);
  font-size: 0.9rem;
}
.fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 18px;
  margin: 0;
}
.field.span-2 { grid-column: 1 / -1; }
.field dt {
  margin: 0 0 3px;
  font-size: 0.68rem;
  font-weight: 650;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.field dd {
  margin: 0;
  font-size: 0.92rem;
  word-break: break-word;
}
.mono {
  font-family: var(--mono);
  font-size: 0.8rem !important;
  color: var(--ink-2) !important;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 22px;
}
.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 999px;
  padding: 10px 16px;
  font-size: 0.88rem;
  font-weight: 560;
  cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
}
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn:hover { border-color: #d6d3d1; }
.pwd-btn {
  appearance: none;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--ink-2);
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 0.78rem;
  font-weight: 540;
  cursor: pointer;
}
.pwd-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: #c5d2e3; }
.pwd-btn.revealed {
  font-family: var(--mono);
  color: var(--ink);
  word-break: break-all;
  text-align: left;
}
.shot-card h3 {
  margin: 0 0 12px;
  font-size: 0.85rem;
  font-weight: 650;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.shot-card img, .shot-card .placeholder {
  width: 100%;
  border-radius: 12px;
  border: 1px solid var(--line);
  display: block;
  background: var(--bg);
}
.shot-card img {
  cursor: zoom-in;
  transition: transform .2s var(--ease);
}
.shot-card img:hover { transform: scale(1.01); }
.shot-card .placeholder {
  padding: 48px 20px;
  text-align: center;
  color: var(--ink-3);
  font-size: 0.9rem;
}

/* Lightbox */
.lb {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(28,25,23,0);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s var(--ease), background .25s;
  cursor: zoom-out;
}
.lb.open {
  opacity: 1;
  pointer-events: auto;
  background: rgba(28,25,23,.72);
  backdrop-filter: blur(6px);
}
.lb img {
  max-width: min(94vw, 1040px);
  max-height: 88vh;
  border-radius: 14px;
  box-shadow: 0 24px 64px rgba(0,0,0,.35);
  transform: scale(.96);
  transition: transform .25s var(--ease);
}
.lb.open img { transform: scale(1); }

.page-foot {
  margin-top: 36px;
  text-align: center;
  font-size: 0.8rem;
  color: var(--ink-3);
}

@media (max-width: 860px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .apps-layout { grid-template-columns: 1fr; }
  .filters { display: none; }
  .tabs-mobile { display: flex; }
  .detail-grid { grid-template-columns: 1fr; }
  .fields { grid-template-columns: 1fr; }
  .field.span-2 { grid-column: 1; }
}
@media (max-width: 480px) {
  .shell { width: calc(100% - 24px); padding-top: 24px; }
  .app-row { grid-template-columns: 1fr; }
  .app-row .right { align-items: flex-start; flex-direction: row; }
}
</style>

      if (filter === "submitted" || filter === "in_progress" || filter === "paused_closed" || filter === "all")
        return { name: "applications", filter: filter };
      return { name: "applications", filter: "all" };
    }
    if (parts[0] === "submitted") return { name: "applications", filter: "submitted" };
    if (parts[0] === "in-progress") return { name: "applications", filter: "in_progress" };
    if (parts[0] === "paused") return { name: "applications", filter: "paused_closed" };
    if (parts[0] === "app" && parts[1]) return { name: "detail", id: parts[1] };
    return { name: "dashboard" };
  }

  function renderDashboard() {
    var c = counts();
    var recent = APPS.slice().sort(function (a, b) {
      return (b.submitted || b.started || "").localeCompare(a.submitted || a.started || "");
    }).slice(0, 4);
    var rows = recent.map(function (a) {
      return (
        '<a class="app-row" href="#/app/' + esc(a.id) + '" data-link>' +
          '<div>' +
            '<h3>' + esc(a.employer) + '</h3>' +
            '<p class="role">' + esc(a.title) + '</p>' +
            '<p class="sub">' + esc(a.location) + (a.submitted ? " · Submitted " + esc(a.submitted) : (a.started ? " · Started " + esc(a.started) : "")) + '</p>' +
          '</div>' +
          '<div class="right">' +
            '<span class="pill ' + pillClass(a.bucket) + '">' + esc(a.status) + '</span>' +
            (a.screenshot ? '<img class="thumb" src="' + a.screenshot + '" alt="" />' : '') +
          '</div>' +
        '</a>'
      );
    }).join("");

    return (
      '<header class="page-head">' +
        '<span class="kicker">Overview</span>' +
        '<h1>Sebas\'s Job Applications</h1>' +
        '<p>Houston-area applications with live status counts. Click a counter to open that list.</p>' +
      '</header>' +
      '<div class="stats">' +
        '<button type="button" class="stat submitted" data-go="#/submitted">' +
          '<div class="n">' + c.submitted + '</div><div class="l">Applications submitted</div>' +
          '<div class="hint">View submitted →</div>' +
        '</button>' +
        '<button type="button" class="stat progress" data-go="#/in-progress">' +
          '<div class="n">' + c.in_progress + '</div><div class="l">In progress</div>' +
          '<div class="hint">View in progress →</div>' +
        '</button>' +
        '<button type="button" class="stat paused" data-go="#/paused">' +
          '<div class="n">' + c.paused_closed + '</div><div class="l">Paused / closed</div>' +
          '<div class="hint">View paused →</div>' +
        '</button>' +
        '<button type="button" class="stat total" data-go="#/applications">' +
          '<div class="n">' + c.total + '</div><div class="l">Total</div>' +
          '<div class="hint">View all →</div>' +
        '</button>' +
      '</div>' +
      '<div class="panel">' +
        '<div class="panel-head"><h2>Recent activity</h2><a href="#/applications" data-link>See all</a></div>' +
        '<div class="app-list" style="padding:12px">' + (rows || '<div class="empty-state">No applications yet.</div>') + '</div>' +
      '</div>'
    );
  }

  function filterLabel(f) {
    return {
      all: "All applications",
      submitted: "Submitted",
      in_progress: "In progress",
      paused_closed: "Paused / closed"
    }[f] || "Applications";
  }

  function renderApplications(filter) {
    var c = counts();
    var list = filterApps(filter);
    var items = list.map(function (a) {
      return (
        '<a class="app-row" href="#/app/' + esc(a.id) + '" data-link>' +
          '<div>' +
            '<h3>' + esc(a.employer) + '</h3>' +
            '<p class="role">' + esc(a.title) + '</p>' +
            '<p class="sub">' + esc(a.location) + ' · ' + esc(a.category) + '</p>' +
          '</div>' +
          '<div class="right">' +
            '<span class="pill ' + pillClass(a.bucket) + '">' + esc(a.status) + '</span>' +
            (a.screenshot ? '<img class="thumb" src="' + a.screenshot + '" alt="" />' : '') +
          '</div>' +
        '</a>'
      );
    }).join("");

    function fbtn(id, label, count, extraClass) {
      var active = filter === id ? " active" : "";
      var href = id === "all" ? "#/applications"
        : id === "submitted" ? "#/submitted"
        : id === "in_progress" ? "#/in-progress"
        : "#/paused";
      return '<button type="button" class="filter-btn' + active + (extraClass ? " " + extraClass : "") + '" data-go="' + href + '">' +
        '<span>' + label + '</span><span class="count">' + count + '</span></button>';
    }

    return (
      '<header class="page-head">' +
        '<a class="back" href="#/" data-link>← Dashboard</a>' +
        '<span class="kicker">Browse</span>' +
        '<h1>' + esc(filterLabel(filter)) + '</h1>' +
        '<p>' + list.length + ' application' + (list.length === 1 ? "" : "s") + ' in this view.</p>' +
      '</header>' +
      '<div class="tabs-mobile">' +
        fbtn("all", "All", c.total) +
        fbtn("submitted", "Submitted", c.submitted) +
        fbtn("in_progress", "In progress", c.in_progress) +
        fbtn("paused_closed", "Paused", c.paused_closed) +
      '</div>' +
      '<div class="apps-layout">' +
        '<aside class="filters">' +
          '<div class="flabel">Status</div>' +
          fbtn("all", "All", c.total) +
          fbtn("submitted", "Submitted", c.submitted) +
          fbtn("in_progress", "In progress", c.in_progress) +
          fbtn("paused_closed", "Paused / closed", c.paused_closed) +
        '</aside>' +
        '<div class="app-list">' +
          (items || '<div class="empty-state">Nothing in this filter yet.</div>') +
        '</div>' +
      '</div>'
    );
  }

  function renderDetail(app) {
    if (!app) {
      return '<header class="page-head"><a class="back" href="#/applications" data-link>← Applications</a><h1>Not found</h1><p>That application is not in the tracker.</p></header>';
    }
    var pwd = app.password
      ? '<div class="field"><dt>Password</dt><dd><button type="button" class="pwd-btn" data-pwd="' + esc(app.password) + '">Reveal</button></dd></div>'
      : '<div class="field"><dt>Password</dt><dd>—</dd></div>';
    var shot = app.screenshot
      ? '<img src="' + app.screenshot + '" alt="Confirmation for ' + esc(app.employer) + '" data-full="' + app.screenshot + '" class="shot-full" />'
      : '<div class="placeholder">No confirmation screenshot yet.</div>';
    var link = app.url
      ? '<a class="btn btn-primary" href="' + esc(app.url) + '" target="_blank" rel="noopener noreferrer">Open posting</a>'
      : '';

    return (
      '<header class="page-head">' +
        '<a class="back" href="#/applications" data-link>← Applications</a>' +
        '<span class="kicker">Application</span>' +
        '<h1>' + esc(app.employer) + '</h1>' +
        '<p>' + esc(app.title) + '</p>' +
      '</header>' +
      '<div class="detail-grid">' +
        '<article class="detail-card">' +
          '<div style="margin-bottom:14px"><span class="pill ' + pillClass(app.bucket) + '">' + esc(app.status) + '</span></div>' +
          '<h2>' + esc(app.employer) + '</h2>' +
          '<p class="role">' + esc(app.title) + '</p>' +
          '<p class="meta">' + esc(app.location) + ' · ' + esc(app.category) + '</p>' +
          '<dl class="fields">' +
            '<div class="field"><dt>Started</dt><dd>' + dash(app.started) + '</dd></div>' +
            '<div class="field"><dt>Submitted</dt><dd>' + dash(app.submitted) + '</dd></div>' +
            '<div class="field span-2"><dt>Resume</dt><dd class="mono">' + dash(app.resume) + '</dd></div>' +
            '<div class="field"><dt>Pay range</dt><dd>' + dash(app.payRange) + '</dd></div>' +
            '<div class="field"><dt>Salary asked</dt><dd>' + dash(app.salaryAsked) + '</dd></div>' +
            '<div class="field span-2"><dt>Account</dt><dd>' + dash(app.account) + '</dd></div>' +
            pwd +
            '<div class="field span-2"><dt>Next step</dt><dd>' + dash(app.nextStep) + '</dd></div>' +
            '<div class="field span-2"><dt>Notes</dt><dd>' + dash(app.notes) + '</dd></div>' +
          '</dl>' +
          '<div class="actions">' + link +
            '<a class="btn" href="#/applications" data-link>Back to list</a>' +
          '</div>' +
        '</article>' +
        '<aside class="shot-card">' +
          '<h3>Confirmation</h3>' + shot +
        '</aside>' +
      '</div>'
    );
  }

  function setActiveNav(route) {
    document.querySelectorAll("[data-nav]").forEach(function (el) {
      var on = (route.name === "dashboard" && el.getAttribute("data-nav") === "dashboard") ||
               ((route.name === "applications" || route.name === "detail") && el.getAttribute("data-nav") === "applications");
      el.classList.toggle("active", on);
    });
  }

  function showView(id) {
    ["view-dashboard", "view-applications", "view-detail"].forEach(function (v) {
      document.getElementById(v).classList.toggle("active", v === id);
    });
  }

  function bindView(root) {
    root.querySelectorAll("[data-go]").forEach(function (el) {
      el.addEventListener("click", function () {
        location.hash = el.getAttribute("data-go");
      });
    });
    root.querySelectorAll(".pwd-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (btn.classList.contains("revealed")) {
          btn.textContent = "Reveal";
          btn.classList.remove("revealed");
        } else {
          btn.textContent = btn.getAttribute("data-pwd") || "";
          btn.classList.add("revealed");
        }
      });
    });
    root.querySelectorAll(".shot-full").forEach(function (img) {
      img.addEventListener("click", function () {
        openLb(img.getAttribute("data-full") || img.src);
      });
    });
  }

  var lb = document.getElementById("lb");
  var lbImg = document.getElementById("lb-img");
  function openLb(src) {
    lbImg.src = src;
    requestAnimationFrame(function () { lb.classList.add("open"); });
  }
  function closeLb() {
    lb.classList.remove("open");
    setTimeout(function () { lbImg.removeAttribute("src"); }, 250);
  }
  lb.addEventListener("click", closeLb);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeLb();
  });

  function render() {
    var route = parseRoute();
    setActiveNav(route);
    document.getElementById("nav-updated").textContent = UPDATED ? ("Updated " + UPDATED) : "";
    document.getElementById("page-foot").textContent = UPDATED ? ("Last updated " + UPDATED) : "";

    var dash = document.getElementById("view-dashboard");
    var apps = document.getElementById("view-applications");
    var detail = document.getElementById("view-detail");

    if (route.name === "dashboard") {
      dash.innerHTML = renderDashboard();
      bindView(dash);
      showView("view-dashboard");
      document.title = "Sebas's Job Applications";
    } else if (route.name === "applications") {
      apps.innerHTML = renderApplications(route.filter || "all");
      bindView(apps);
      showView("view-applications");
      document.title = filterLabel(route.filter || "all") + " · Sebas Jobs";
    } else if (route.name === "detail") {
      var app = findApp(route.id);
      detail.innerHTML = renderDetail(app);
      bindView(detail);
      showView("view-detail");
      document.title = (app ? app.employer : "Not found") + " · Sebas Jobs";
    }
  }

  window.addEventListener("hashchange", render);
  if (!location.hash) location.hash = "#/";
  else render();
})();
</script>
</body>
</html>
